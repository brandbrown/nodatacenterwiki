# Canonical checkpoint model for the MD-PHX1 data center project.
# This file drives the public timeline page. Agents may update `status`,
# `date`, `sources`, and append community/legal items. Keep every factual claim
# tied to a source URL so the public site stays defensible.
#
# stage.status / checkpoint.status values:
#   done         - completed / granted
#   in_progress  - actively under review or "in correction"
#   pending      - not yet started / not yet reached
#   contested    - approved but being challenged, or a live dispute
#   blocked      - denied / stalled by the city or an agency
#
# community: public-facing actions residents can take at this stage.
# legal:     attorney-only notes. NOT rendered on the public timeline.

project:
  name: "MD-PHX1 Data Center (Menlo Digital)"
  case: "23-1632"
  address: "4801-4811 E Thistle Landing Dr, Phoenix, AZ 85044"
  developer: "Menlo Equities / Thistle Income Partners LLC"
  scale: "5 buildings, ~1,022,400 sq ft, 257 MW, 100+ diesel generators, dedicated SRP substation"
  developer_targets: "Substation + shells 2026 Q4; data hall delivery 2027 Q1 (per Menlo Digital)"
  summary: >
    The site carries a legacy PUD "Data Center Campus" analogous-use entitlement and
    received preliminary site plan approval in 2024, which exempts it from the stricter
    2025 Phoenix data center ordinance. The remaining questions are at the permit and
    compliance level, not zoning: the Final Plat is denied, several permits are in
    active correction, and no noise/air/water studies appear in the public record.
  last_updated: "2026-08-18"

# High-level phases used to compute the progress bar. Ordered.
stages:
  - id: zoning-entitlement
    title: "Zoning & Entitlement"
    status: done
    summary: >
      Land has carried Commerce Park / General Commerce Park zoning since the 1970s-90s.
      A "Data Center Campus" was approved as an analogous use via the Zoning Administrator's
      interpretation process rather than a public rezoning.
    checkpoints:
      - title: "Legacy PUD / Commerce Park zoning in place"
        status: done
        date: "1996"
        note: "Permits light industrial + office use; predates modern data centers."
        sources:
          - "https://www.ahwatukee.com/news/data-center-request-sparks-council-hand-wringing/article_fe96541b-6e93-4727-ae0d-727984a244bb.html"
      - title: "Data Center Campus approved as analogous use"
        status: done
        note: "Approved through informal Zoning Administrator interpretation (Case Z-62-17 framework)."
        sources:
          - "https://www.phoenix.gov/content/dam/phoenix/pddsite/documents/planning-zoning-pud/z-62-17n.pdf"
    legal:
      - title: "Analogous-use interpretation"
        note: >
          The data center was permitted via an informal analogous-use interpretation, not a
          public rezoning. Whether that process was proper for an industrial-scale 257 MW
          facility is a question for the attorney to evaluate. Likely time-barred, but document it.

  - id: preliminary-site-approval
    title: "Preliminary Site Plan Approval"
    status: done
    summary: >
      Preliminary site approval was granted in 2024. This is the decision that grandfathered
      the project out of the 2025 data center ordinance (setbacks, added review).
    checkpoints:
      - title: "Preliminary site plan approved (2024)"
        status: done
        date: "2024"
        note: "Basis for exemption from 2025 ordinance per Council legal guidance."
        sources:
          - "https://www.abc15.com/news/local-news/ahwatukee-neighbors-calling-for-stronger-regulations-on-data-center-under-construction"
    legal:
      - title: "2025 ordinance exemption cutoff"
        note: >
          Council set an applicability cutoff for the 2025 ordinance keyed to preliminary
          site approval. Confirm the exact date/record and whether MD-PHX1 truly qualified.

  - id: easements
    title: "Easement Abandonments"
    status: done
    summary: >
      City Council approved abandonment of a 185-ft drainage easement and a 20-ft waterline
      easement near 48th St & Thistle Landing, needed for the site's drainage solution.
    checkpoints:
      - title: "Drainage + waterline easement abandonment approved"
        status: done
        date: "2025-07"
        note: "Approved by Council (one dissenting vote). Framed as a technical action."
        sources:
          - "https://www.ahwatukee.com/news/data-center-request-sparks-council-hand-wringing/article_fe96541b-6e93-4727-ae0d-727984a244bb.html"

  - id: final-plat
    title: "Final Plat"
    status: blocked
    summary: >
      The Final Plat is required before any Certificate of Occupancy. City reviewers have
      DENIED it. This is currently the single clearest procedural chokepoint.
    checkpoints:
      - title: "Final Plat submitted"
        status: done
      - title: "Final Plat approved by city reviewers"
        status: blocked
        note: "Denied by the city's own reviewers as of site's latest public statement."
        sources:
          - "https://nodatacenterahwatukee.org/"
    community:
      - title: "Request the plat review file"
        priority: high
        how: >
          Any resident can file a public records request on City of Phoenix Project 23-1632
          for the Final Plat comments. Share what you learn with neighbors and the Alliance
          so each re-submittal is tracked in public.
    legal:
      - title: "Plat denial posture"
        note: >
          Track every re-submittal. Identify the specific review comments causing denial and
          whether they are curable.

  - id: final-site-plan
    title: "Final Site Plan"
    status: in_progress
    summary: "Final site plan remains in active correction with the city."
    checkpoints:
      - title: "Final site plan under review / in correction"
        status: in_progress
        sources:
          - "https://nodatacenterahwatukee.org/"
    community:
      - title: "Follow each correction cycle"
        how: >
          Request the current site-plan review comments and any revised drawings. Correction
          cycles are public; putting them in the community record keeps the process visible.
    legal:
      - title: "Correction-cycle deficiencies"
        note: "Every correction is a record of deficiencies for counsel to review."

  - id: site-grading
    title: "Grading / Civil / Site Permits"
    status: in_progress
    summary: >
      Site work (grading, demolition, first building shells) is underway under partial permits,
      even as downstream approvals remain incomplete.
    checkpoints:
      - title: "Grading / demolition permits issued"
        status: done
      - title: "Civil / site permits fully approved"
        status: in_progress
    community:
      - title: "Document on-site conditions"
        priority: high
        how: >
          If you live nearby, note dates, times, and photos of dust, muddy runoff, or unusual
          noise during grading. Stormwater (AZPDES) and dust-control (Maricopa County Rule 310)
          complaints can trigger inspections.

  - id: building-permits
    title: "Building Permits"
    status: in_progress
    summary: "Both building permits remain in active correction."
    checkpoints:
      - title: "Building permit - Building set A in correction"
        status: in_progress
        sources:
          - "https://nodatacenterahwatukee.org/"
      - title: "Building permit - Building set B in correction"
        status: in_progress
        sources:
          - "https://nodatacenterahwatukee.org/"
    community:
      - title: "Ask for the building-permit comments"
        how: >
          Request the open correction items on both building permits. Knowing what the city
          is still asking for helps the community follow remaining checkpoints.

  - id: substation
    title: "SRP Substation Approval"
    status: pending
    summary: "Dedicated on-site 257 MW substation approvals (SRP + city) are pending."
    checkpoints:
      - title: "Substation design / city approval"
        status: pending
      - title: "SRP interconnection / energization"
        status: pending
    community:
      - title: "Watch for public notice on the substation"
        how: >
          When the substation comes before the city, ask about setbacks, fencing, fire access,
          and whether nearby homes were noticed. Attend the meeting if one is scheduled.

  - id: air-permits
    title: "Air Quality Permits (Diesel Generators)"
    status: pending
    summary: >
      100+ diesel backup generators almost certainly trigger Maricopa County Air Quality Dept
      and/or ADEQ permitting. These processes carry public comment periods — the most
      concrete way for residents to be heard.
    checkpoints:
      - title: "Air quality permit application filed (Maricopa County / ADEQ)"
        status: pending
        note: "Watch for the application and its public comment window."
      - title: "Public comment period"
        status: pending
    community:
      - title: "Prepare for the air-permit comment window"
        priority: high
        how: >
          This is the highest-value resident action still ahead. When Maricopa County or ADEQ
          posts a public notice, anyone can submit written comments and/or request a hearing
          (typically a 30-day window). Watch this page and the Alliance list so the window
          is not missed. Comments to AQPermits@maricopa.gov must include name, mailing address,
          and reasons tied to whether the permit meets state criteria.

  - id: noise-compliance
    title: "Noise / Acoustic Compliance"
    status: pending
    summary: >
      No noise study appears in the record. Cooling + generators run 24/7; terrain creates an
      amphitheater effect. Compliance with the Phoenix noise ordinance is testable.
    checkpoints:
      - title: "Acoustic study demonstrating ordinance compliance"
        status: pending
        note: "Independent acoustic study commissioned by residents exists; city record lacks one."
        sources:
          - "https://nodatacenterahwatukee.org/"
    community:
      - title: "Ask the city to put a noise study on the record"
        how: >
          Contact District 6 (Councilman Kevin Robinson, 602-262-7485,
          council.district.6@phoenix.gov) and Planning & Development. Ask that approvals
          demonstrate compliance with Phoenix noise standards, including terrain and
          temperature inversions. Point them to the residents' independent acoustic study.

  - id: other-utility-fire
    title: "Water, Stormwater & Fire Review"
    status: pending
    summary: "Water/wastewater service, AZPDES stormwater, and fire/hazmat (diesel storage) reviews."
    checkpoints:
      - title: "Water / wastewater service approval"
        status: pending
      - title: "Fire code + diesel hazmat storage review"
        status: pending
    community:
      - title: "Ask about diesel storage and fire access"
        how: >
          Large on-site diesel storage is a fire and hazardous-materials question. Ask Phoenix
          Fire and PDD whether that review is complete and what the public can inspect.

  - id: occupancy
    title: "Final Inspections / Certificate of Occupancy"
    status: pending
    summary: >
      The end gate. Cannot be issued without an approved Final Plat and passing all inspections.
    checkpoints:
      - title: "Final inspections"
        status: pending
      - title: "Certificate of Occupancy"
        status: pending
        note: "Blocked while Final Plat remains denied."
    community:
      - title: "Stay with the process through occupancy"
        how: >
          A Certificate of Occupancy is the last city checkpoint. Keep attending Alliance
          meetings and contacting District 6 so this stage is not rubber-stamped in silence.
